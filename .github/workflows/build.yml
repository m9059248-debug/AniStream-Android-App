name: AniStream Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Mipmap App Icons & Auto-Link Manifest
        run: |
          cat << 'EOF' > ResizeLogo.java
          import java.awt.Graphics2D;
          import java.awt.RenderingHints;
          import java.awt.image.BufferedImage;
          import java.io.File;
          import java.nio.file.Files;
          import java.nio.file.StandardCopyOption;
          import javax.imageio.ImageIO;

          public class ResizeLogo {
              public static void main(String[] args) throws Exception {
                  System.setProperty("java.awt.headless", "true");
                  File drawDir = new File("app/src/main/res/drawable");
                  drawDir.mkdirs();
                  File src = null;
                  File[] list = drawDir.listFiles();
                  if (list != null) {
                      for (File f : list) {
                          if (f.getName().endsWith(".txt")) {
                              f.delete();
                          } else if (f.isFile() && !f.getName().toLowerCase().endsWith(".xml")) {
                              src = f;
                          }
                      }
                  }
                  if (src == null) return;
                  BufferedImage img = ImageIO.read(src);
                  File mainLogo = new File(drawDir, "app_logo.png");
                  if (!src.equals(mainLogo)) {
                      Files.move(src.toPath(), mainLogo.toPath(), StandardCopyOption.REPLACE_EXISTING);
                  }
                  String[] folders = {"drawable", "mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"};
                  int[] sizes = {192, 48, 72, 96, 144, 192};
                  for (int i = 0; i < folders.length; i++) {
                      File dir = new File("app/src/main/res/" + folders[i]);
                      dir.mkdirs();
                      File out = new File(dir, "app_logo.png");
                      if (img != null) {
                          BufferedImage scaled = new BufferedImage(sizes[i], sizes[i], BufferedImage.TYPE_INT_ARGB);
                          Graphics2D g = scaled.createGraphics();
                          g.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_BILINEAR);
                          g.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON);
                          g.drawImage(img, 0, 0, sizes[i], sizes[i], null);
                          g.dispose();
                          ImageIO.write(scaled, "png", out);
                      } else if (!out.equals(mainLogo)) {
                          Files.copy(mainLogo.toPath(), out.toPath(), StandardCopyOption.REPLACE_EXISTING);
                      }
                  }
              }
          }
          EOF
          java ResizeLogo.java
          rm -f ResizeLogo.java
          python3 -c '
          import re, pathlib
          p = pathlib.Path("app/src/main/AndroidManifest.xml")
          if p.exists():
              txt = p.read_text()
              txt = re.sub(r"\s*android:icon=\"[^\"]*\"", "", txt)
              txt = re.sub(r"\s*android:roundIcon=\"[^\"]*\"", "", txt)
              txt = txt.replace("<application", "<application\n        android:icon=\"@mipmap/app_logo\"\n        android:roundIcon=\"@mipmap/app_logo\"", 1)
              p.write_text(txt)
          '

      - name: Setup Fixed Signing Key
        run: |
          mkdir -p ~/.android keystore
          if [ ! -f keystore/anistream.keystore ]; then
            keytool -genkey -v -keystore keystore/anistream.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AniStream Hindi,O=AniStream,C=IN"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add keystore/anistream.keystore
            git commit -m "chore: save permanent signing keystore [skip ci]" || true
            git push || true
          fi
          cp keystore/anistream.keystore ~/.android/debug.keystore

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk AniStream-Hindi.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniStream-Hindi-APK
          path: AniStream-Hindi.apk

      - name: Publish Direct APK Link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AniStream Hindi Latest Official APK (v1.1)
          files: AniStream-Hindi.apk
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
