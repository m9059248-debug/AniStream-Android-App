name: AniStream Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Mipmap App Icons & Auto-Link Manifest
        run: |
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          rm -f app/src/main/res/drawable/*.txt
          for img in app/src/main/res/drawable/*; do
            [ -e "$img" ] || continue
            ext="${img##*.}"
            ext_lower=$(echo "$ext" | tr '[:upper:]' '[:lower:]')
            if [ "$ext_lower" != "xml" ]; then
              ffmpeg -y -i "$img" -vf "scale=192:192" -pix_fmt rgba app/src/main/res/drawable/fixed_logo.png || cp "$img" app/src/main/res/drawable/fixed_logo.png
              rm -f "$img"
              mv app/src/main/res/drawable/fixed_logo.png app/src/main/res/drawable/app_logo.png
              ffmpeg -y -i app/src/main/res/drawable/app_logo.png -vf "scale=48:48" -pix_fmt rgba app/src/main/res/mipmap-mdpi/app_logo.png
              ffmpeg -y -i app/src/main/res/drawable/app_logo.png -vf "scale=72:72" -pix_fmt rgba app/src/main/res/mipmap-hdpi/app_logo.png
              ffmpeg -y -i app/src/main/res/drawable/app_logo.png -vf "scale=96:96" -pix_fmt rgba app/src/main/res/mipmap-xhdpi/app_logo.png
              ffmpeg -y -i app/src/main/res/drawable/app_logo.png -vf "scale=144:144" -pix_fmt rgba app/src/main/res/mipmap-xxhdpi/app_logo.png
              ffmpeg -y -i app/src/main/res/drawable/app_logo.png -vf "scale=192:192" -pix_fmt rgba app/src/main/res/mipmap-xxxhdpi/app_logo.png
              break
            fi
          done
          python3 -c '
          import re, pathlib
          p = pathlib.Path("app/src/main/AndroidManifest.xml")
          if p.exists():
              txt = p.read_text()
              txt = re.sub(r"\s*android:icon=\"[^\"]*\"", "", txt)
              txt = re.sub(r"\s*android:roundIcon=\"[^\"]*\"", "", txt)
              txt = txt.replace("<application", "<application\n        android:icon=\"@mipmap/app_logo\"\n        android:roundIcon=\"@mipmap/app_logo\"", 1)
              p.write_text(txt)
          '

      - name: Setup Fixed Signing Key
        run: |
          mkdir -p ~/.android keystore
          if [ ! -f keystore/anistream.keystore ]; then
            keytool -genkey -v -keystore keystore/anistream.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AniStream Hindi,O=AniStream,C=IN"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add keystore/anistream.keystore
            git commit -m "chore: save permanent signing keystore [skip ci]" || true
            git push || true
          fi
          cp keystore/anistream.keystore ~/.android/debug.keystore

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk AniStream-Hindi.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniStream-Hindi-APK
          path: AniStream-Hindi.apk

      - name: Publish Direct APK Link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AniStream Hindi Latest Official APK (v1.1)
          files: AniStream-Hindi.apk
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
