name: AniStream Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk AniStream-Hindi.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniStream-Hindi-APK
          path: AniStream-Hindi.apk

      - name: Publish Direct APK Link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: AniStream Hindi Official APK
          files: AniStream-Hindi.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
